# tmux config - Tokyonight DevOps/SRE Setup

# --- Prefix ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- General Settings ---
set -g mouse on
set -g base-index 1           # Start windows at 1
set -g pane-base-index 1      # Start panes at 1
set -g renumber-windows on    # Renumber windows when one is closed
set -g history-limit 10000    # Increase scrollback buffer
set -g display-time 2000      # Status messages last longer
set -s escape-time 0          # Faster command sequences
set -g focus-events on

# --- Terminal Compatibility ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# --- Keybindings ---
# Split panes using | and - (Prefix followed by the key)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}" # Same as | but without Shift
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}" # Same as - but with Shift
unbind '"'
unbind %

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast pane switching with Alt-Arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# --- Tokyonight Aesthetic ---
set -g status-position top
set -g status-justify left
set -g status-style "bg=#011628,fg=#7aa2f7"

set -g status-left "#[bg=#7aa2f7,fg=#011628,bold] #S #[bg=#011628,fg=#7aa2f7] "
set -g status-right "#[fg=#bb9af7,bg=#011628] %H:%M #[fg=#011628,bg=#7aa2f7,bold] #H "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#143652,fg=#CBE0F0,bold] #I:#W #[default]"

set -g pane-border-style "fg=#143652"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#143652,fg=#CBE0F0"
