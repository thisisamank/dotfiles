; Polybar config for DevOps/SRE Tokyonight setup

[colors]
background = #011628
background-alt = #143652
foreground = #CBE0F0
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
disabled = #414868
border = #547998
success = #9ece6a

[bar/main]
width = 100%
height = 28pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrains Mono:size=12;2"
font-1 = "JetBrains Mono:size=12:weight=bold;2"

modules-left = xworkspaces
modules-center = 
modules-right = netspeed battery memory cpu wlan date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; Disable tray to fix XCB_MATCH error
tray-position = none

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/netspeed]
type = internal/network
interface = wlp2s0
interval = 1.0
label-connected = "UP %upspeed% DOWN %downspeed%"
label-connected-foreground = ${colors.primary}

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "BAT+ "
format-charging-prefix-foreground = ${colors.success}
label-charging = %percentage%%

format-discharging = <label-discharging>
format-discharging-prefix = "BAT- "
format-discharging-prefix-foreground = ${colors.primary}
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.success}
label-full = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#7aa2f7}%essid%%{F-}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
